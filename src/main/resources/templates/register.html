<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        .error { color: darkred; }
    </style>
</head>
<body>
<h1>Register</h1>
<div th:if="${error}" class="error" th:text="${error}"></div>
<form th:action="@{/register}" method="post" th:object="${user}">
    <label>Email: <input type="email" th:field="*{email}" required /></label><br/>
    <label>Username: <input type="text" th:field="*{username}" required /></label><br/>
    <label>Password: <input class="pwd" type="password" th:field="*{password}" required /></label><br/>
    <label>Confirm Password: <input class="pwd" type="password" name="passwordConfirm" required /></label><br/>
    <label>First name: <input type="text" th:field="*{firstName}" /></label><br/>
    <label>Last name: <input type="text" th:field="*{lastName}" /></label><br/>
    <label>Address: <input type="text" th:field="*{address}" /></label><br/>
    <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="/login">Login</a></p>
</body>
</html>
