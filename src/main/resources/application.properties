spring.application.name=demo
trending.geohashPrecision=5
trending.windowHours=24
trending.limit=20
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/jutjubic_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Upload limits
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# Storage
app.storage.base-dir=./uploads
app.storage.upload-timeout-seconds=15
# FFprobe resolution:
# - app.ffmpeg.path can be set explicitly (or "auto")
# - otherwise app.ffmpeg.base-dir + OS-specific binary is used
app.ffmpeg.path=auto
app.ffmpeg.base-dir=lib/ffmpeg/bin

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always

# Metrics tags
management.metrics.tags.application=jutjubic

# Database connection pool metrics (HikariCP)
management.metrics.enable.hikaricp=true

# JVM metrics
management.metrics.enable.jvm=true

# System metrics (CPU, memory)
management.metrics.enable.system=true

# Custom metrics export interval
management.metrics.export.prometheus.step=10s
